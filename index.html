    for(var i=0;i<4;i++){var o=ST.names[i]&&!(inv[i]!==undefined&&on[inv[i]]);h+='<tr><td>'+(i+1)+'</td><td>'+(ST.names[i]?'<span class="dot'+(o?' off':'')+'"></span>'+esc(ST.names[i]):'<span style="color:var(--muted)">খালি</span>')+'</td></tr>'}

    if(me.host){h+=cnt<4?'<div class="note">খেলা শুরু করতে ৪ জন লাগবে (এখন '+cnt+' জন)</div>':'<div class="note">রাউন্ড বাছো, তারপর খেলা শুরু হবে</div><div class="c"><button class="big rb" data-n="5">৫ রাউন্ড</button><button class="big rb" data-n="10">১০ রাউন্ড</button><button class="big rb" data-n="20">২০ রাউন্ড</button></div>'}
    else h+='<div class="note">৪ জন হলে হোস্ট খেলা শুরু করবে...</div>';
    P.innerHTML=h;$('sh').onclick=shareLink;
    Array.prototype.forEach.call(P.querySelectorAll('.rb'),function(b){b.onclick=function(){hStart(+b.getAttribute('data-n'))}});msg('');
  }
  else if(p==='shuffle')msg('কাগজ মেলানো হচ্ছে...');
  else if(p==='pick')msg(mine?'অন্যরা কাগজ তোলার অপেক্ষা...':'যেকোনো একটা কাগজ ট্যাপ করো বা নিজের দিকে টানো');
  else if(p==='reveal')msg(me.opened?'অন্যদের জন্য অপেক্ষা...':'চারদিক থেকে টেনে ভাঁজ খোলো ('+fd+'/৪)');
  else if(p==='announce'){msg('ঘোষণা চলছে...');if(ST.wait===me.seat)act('📢 '+ST.waitTxt,function(){send({t:'say'})})}
  else if(p==='guess'){
    if(ST.guessBy===me.seat){msg('তুমি পুলিশ! চোর কে? একজনের নামে ট্যাপ করো');
      [0,1,2,3].forEach(function(s){if(s!==me.seat&&ST.said[s]!=='আমি বাবু!'){var l2=labs[disp(s)];l2.el.classList.add('pick');l2.el.onclick=function(){sfx.click();send({t:'guess',seat:s})}}})}
    else msg((ST.names[ST.guessBy]||'পুলিশ')+' ভাবছে চোর কে...');
  }
  else if(p==='result'&&ST.result){
    var r=ST.result;msg(r.ok?'✅ পুলিশ চোর ধরে ফেলেছে!':'❌ ভুল ধরা! পুলিশ ও ডাকাতের পয়েন্ট উল্টে গেল');
    var rows='';for(var j=0;j<4;j++){var ro=ROLES[r.roles[j]];rows+='<tr><td>'+esc(ST.names[j])+'</td><td>'+ro.e+' '+ro.n+'</td><td>+'+r.sc[j]+'</td><td><b>'+ST.tot[j]+'</b></td></tr>'}
    var t='<table><tr><th>খেলোয়াড়</th><th>চরিত্র</th><th>এই রাউন্ড</th><th>মোট</th></tr>'+rows+'</table>';
    if(ST.final){
      t='<div class="res">🏆 কিং: '+king.map(function(s){return esc(ST.names[s])}).join(' ও ')+'!</div>'+t
       +(me.host?'<button class="big full" id="ag">🔁 আবার খেলো</button>':'<div class="note">হোস্ট আবার শুরু করলে নতুন খেলা শুরু হবে</div>')
       +'<button class="big full alt" id="hm2">🏠 হোমে যাও</button><button class="big full alt2" id="ds2">📊 আমার ড্যাশবোর্ড</button>';
      P.innerHTML=t;$('hm2').onclick=goHome;$('ds2').onclick=function(){goHome();VIEW='dash';homeUI()};
      if($('ag'))$('ag').onclick=function(){hStart(ST.total)};
    }else{P.innerHTML=t;if(me.host)act('পরের রাউন্ড ▶',hNext);else msg('হোস্ট পরের রাউন্ড শুরু করার অপেক্ষা...')}
  }
}

/* ---------- হোম, লগইন, ড্যাশবোর্ড ---------- */
function lastRoom(){try{return JSON.parse(localStorage.getItem('cdpb_last')||'null')}catch(e){return null}}
function isHostFor(code){try{var o=JSON.parse(localStorage.getItem('cdpb_h_'+code)||'null');return !!(o&&o.humans&&o.humans[0]===myUid()&&Date.now()-o.t<6*3600*1000)}catch(e){return false}}
function roomHtml(){
  var h='<input id="gn" maxlength="12" placeholder="গেমে তোমার নাম" value="'+esc(accName()||me.name||'')+'">';
  if(INV)return h+'<button class="big full" id="jn">🚪 ঢোকো (রুম '+INV+')</button>';
  h+='<button class="big full" id="mk">🎮 নতুন রুম খোলো</button><div class="note">অথবা বন্ধুর দেওয়া কোড দিয়ে ঢোকো</div><input id="cd" maxlength="6" placeholder="রুমের কোড" style="text-transform:uppercase"><button class="big full alt" id="jn">🔑 কোড দিয়ে ঢোকো</button>';
  var lr=lastRoom();if(lr&&lr.code)h+='<button class="big full alt2" id="bk">↩ আগের রুমে ফিরে যাও ('+esc(lr.code)+')</button>';
  return h;
}
function bindRoom(){
  var gn=function(){return(($('gn').value||'').trim().slice(0,12))||accName()||'খেলোয়াড়'};
  if($('mk'))$('mk').onclick=function(){me.name=gn();enter((Math.random().toString(36)+'0000').slice(2,6).toUpperCase(),true)};
  if($('jn'))$('jn').onclick=function(){var c=(INV||($('cd')?$('cd').value:'')).toUpperCase().replace(/[^A-Z0-9]/g,'');if(!c){err('আগে রুমের কোড লেখো');return}me.name=gn();enter(c,isHostFor(c))};
  if($('bk'))$('bk').onclick=function(){var lr=lastRoom();me.name=gn();enter(lr.code,isHostFor(lr.code))};
}
function homeUI(){
  var P=$('panel');setFrame(false);act(null);msg('');updateBar();
  if(VIEW==='dash'){dashUI();return}
  var h='';
  if(!SB)h+='<div class="note" style="color:#c0392b">⚠️ অনলাইনের সেটআপ এখনও হয়নি (README দেখো)</div>';
  if(AUTH.user){var st=stats();
    h+='<div class="res">স্বাগতম, '+esc(accName())+'!</div><div class="note">@'+esc((AUTH.user.user_metadata||{}).username||'')+' · খেলা '+st.games+' · জয় '+st.wins+'</div>'
     +(INV?'<div class="note">তোমাকে ডাকা হয়েছে</div><div class="code">'+INV+'</div>':'')+roomHtml()
     +'<button class="big full dark" id="ds">📊 আমার ড্যাশবোর্ড</button><button class="big full" id="lo" style="background:var(--muted)">লগআউট</button>';
  }else{
    h+=(INV?'<div class="res">তোমাকে খেলতে ডাকা হয়েছে!</div><div class="code">'+INV+'</div>':'<div class="res">কীভাবে খেলবে?</div>')
     +'<div class="tabs"><button class="tab'+(TAB==='login'?' on':'')+'" data-t="login">লগইন</button><button class="tab'+(TAB==='signup'?' on':'')+'" data-t="signup">নতুন অ্যাকাউন্ট</button><button class="tab'+(TAB==='guest'?' on':'')+'" data-t="guest">শুধু নাম</button></div>';
    if(TAB==='login')h+='<input id="lu" placeholder="ইউজারনেম" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"><button class="big full" id="dl">লগইন করো</button>';
    else if(TAB==='signup')h+='<input id="su" placeholder="ইউজারনেম (ইংরেজি, যেমন rafi_01)" autocapitalize="none" autocomplete="username"><input id="sp" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password"><input id="sn" maxlength="12" placeholder="গেমে যে নাম দেখাবে (বাংলাও চলবে)"><button class="big full" id="dg">অ্যাকাউন্ট খোলো</button><div class="note">অ্যাকাউন্ট থাকলে কতবার জিতলে তার হিসাব থাকবে</div>';
    else h+=roomHtml();
  }
  h+='<div id="err" class="note" style="color:#c0392b"></div>';
  P.innerHTML=h;
  Array.prototype.forEach.call(P.querySelectorAll('.tab'),function(b){b.onclick=function(){TAB=b.getAttribute('data-t');homeUI()}});
  if($('dl'))$('dl').onclick=function(){var b=this;b.disabled=true;doLogin($('lu').value,$('lp').value).then(function(e){if(e){b.disabled=false;err(e)}else homeUI()})};
  if($('dg'))$('dg').onclick=function(){var b=this;b.disabled=true;doSignup($('su').value,$('sp').value,$('sn').value).then(function(e){if(e){b.disabled=false;err(e)}else homeUI()})};
  if($('ds'))$('ds').onclick=function(){VIEW='dash';homeUI()};
  if($('lo'))$('lo').onclick=function(){SB.auth.signOut().then(function(){AUTH.user=null;homeUI()},function(){AUTH.user=null;homeUI()})};
  bindRoom();
}
function dashUI(){
  var P=$('panel'),st=stats(),rate=st.games?Math.round(st.wins*100/st.games):0,h='<div class="res">📊 আমার ড্যাশবোর্ড</div>';
  if(!AUTH.user)h+='<div class="note">অ্যাকাউন্ট খুললে বা লগইন করলে তোমার জয়ের হিসাব এখানে থাকবে।</div>';
  else h+='<div class="c"><b>'+esc(accName())+'</b></div><div class="stats"><div class="stat"><b>'+st.games+'</b><span>খেলা</span></div><div class="stat"><b>'+st.wins+'</b><span>জয় 🏆</span></div><div class="stat"><b>'+rate+'%</b><span>জয়ের হার</span></div></div><div class="note">সর্বোচ্চ স্কোর: '+st.best+'</div>';
  P.innerHTML=h+'<button class="big full alt" id="bh">🏠 হোমে ফিরো</button>';
  $('bh').onclick=function(){VIEW='home';homeUI()};
}
function stopVoice(){Object.keys(VC.pcs).forEach(function(k){try{VC.pcs[k].close()}catch(e){}});VC.pcs={};VC.q={};if(VC.stream)VC.stream.getTracks().forEach(function(t){t.stop()});VC.stream=null;VC.muted=false;$('audios').innerHTML=''}
function goHome(){
  try{sessionStorage.removeItem('cdpb_s')}catch(e){}
  if(RM){try{RM.leave()}catch(e){}}
  RM=null;ST=null;H=null;clearInterval(hbIv);stopVoice();lastPhase='';lastKey='';INV='';shuffleTok++;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  papers.forEach(function(q){q.gen=(q.gen||0)+1;q.flaps.forEach(function(f){f.tok=(f.tok||0)+1;f.done=false;setAngle(f,0)});q.open=false;q.lc=undefined;setRole(q,null);pos(q,50,50,0)});
  labs.forEach(function(l){l.el.style.display='none';l.sa.textContent=''});
  me.seat=-1;me.role=null;me.roleMsg=null;me.opened=false;VIEW='home';homeUI();
}
async function enter(code,host){
  try{await enter0(code,host)}
  catch(e){RM=null;H=null;clearInterval(hbIv);homeUI();err('রুমে ঢোকা যায়নি: '+((e&&(e.code||e.message))||e))}
}
async function enter0(code,host){
  if(!R)throw new Error('অনলাইনের সেটআপ হয়নি (README দেখো)');
  me.uid=myUid();me.peer=me.uid;me.host=host;
  RM=await R.join(code.toLowerCase());
  RM.on('act',onAct);RM.on('st',onStMsg);RM.on('role',onRole);RM.on('sig',onSig);
  RM.onPeers(onPeers);RM.presence({name:me.name,voice:false});
  if(host){H=loadH(code)||{code:code,gid:'',phase:'lobby',round:0,total:5,tot:[0,0,0,0],names:['','','',''],seats:{},claim:[-1,-1,-1,-1],said:['','','',''],wait:-1,guessBy:-1,result:null,humans:[],opened:{}};
    clearInterval(hbIv);hbIv=setInterval(bc,8000);if(H.resumeMe)later(resume,600)}
  try{var info=JSON.stringify({code:code,name:me.name,host:host});sessionStorage.setItem('cdpb_s',info);localStorage.setItem('cdpb_last',info)}catch(e){}
  VIEW='room';setFrame(true);lastKey='';
  var hello=function(){if(!RM)return;if(!ST||ST.seats[me.uid]===undefined||ST.names[ST.seats[me.uid]]!==me.name){send({t:'hello',name:me.name});later(hello,1800)}};hello();
  if(!host)later(function(){if(RM&&!ST)msg('হোস্ট পাওয়া যায়নি। কোড ঠিক আছে তো? হোস্ট কি অনলাইনে আছে?')},7000);
  updateBar();render();
}

/* ---------- ভয়েস চ্যাট (WebRTC) ---------- */
var VC={stream:null,pcs:{},q:{},muted:false};
function onPeers(c){lastPeers=c.peers;c.left.forEach(function(p){if(VC.pcs[p.peer]){VC.pcs[p.peer].close();delete VC.pcs[p.peer]}});if(VC.stream)connectVoice();if(ST)render()}
async function voiceOn(){
  try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){msg('মাইক চালু করা গেল না (অনুমতি নেই বা এই ভিউয়ারে ভয়েস সাপোর্ট নেই)। গেম এমনিই চলবে।');return}
  RM.presence({voice:true,muted:false});connectVoice();updateBar();
}
function connectVoice(){lastPeers.forEach(function(p){if(!p.isMe&&p.presence&&p.presence.voice&&!VC.pcs[p.peer]&&me.peer&&me.peer<p.peer)mkPC(p.peer,true)})}
function mkPC(id,init){
  var pc=new RTCPeerConnection({iceServers:CONFIG.ICE});VC.pcs[id]=pc;
  VC.stream.getTracks().forEach(function(t){pc.addTrack(t,VC.stream)});
  pc.onicecandidate=function(e){if(e.candidate)RM.emit('sig',{to:id,k:'c',c:e.candidate.toJSON()}).catch(function(){})};
  pc.ontrack=function(e){var a=document.createElement('audio');a.autoplay=true;a.srcObject=e.streams[0];$('audios').appendChild(a);a.play().catch(function(){})};
  if(init)pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){RM.emit('sig',{to:id,k:'o',s:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}}).catch(function(){})});
  return pc;
}
async function onSig(m){
  var d=m.data||{};if(m.isMe||d.to!==me.peer||!VC.stream)return;var id=m.peer,pc=VC.pcs[id];
  try{
    if(!pc)pc=mkPC(id,false);
    if(d.k==='o'){await pc.setRemoteDescription(d.s);var a=await pc.createAnswer();await pc.setLocalDescription(a);
      RM.emit('sig',{to:id,k:'a',s:{type:a.type,sdp:a.sdp}}).catch(function(){});flush(id,pc)}
    else if(d.k==='a'){await pc.setRemoteDescription(d.s);flush(id,pc)}
    else if(d.k==='c'){if(pc.remoteDescription)await pc.addIceCandidate(d.c);else(VC.q[id]=VC.q[id]||[]).push(d.c)}
  }catch(e){}
}
function flush(id,pc){(VC.q[id]||[]).forEach(function(c){pc.addIceCandidate(c).catch(function(){})});VC.q[id]=[]}
$('vb').onclick=voiceOn;
$('mb').onclick=function(){VC.muted=!VC.muted;VC.stream.getAudioTracks().forEach(function(t){t.enabled=!VC.muted});$('mb').textContent=VC.muted?'🎙 মিউট খোলো':'🔇 মিউট';RM.presence({voice:true,muted:VC.muted})};


$('hm').onclick=goHome;
if(SB&&window.supabase)R=sbRoom();
homeUI();
initAuth(function(){
  var sv=null;try{sv=JSON.parse(sessionStorage.getItem('cdpb_s')||'null')}catch(e){}
  if(sv&&sv.code&&R&&!RM){me.name=sv.name||accName()||'খেলোয়াড়';enter(sv.code,sv.host)}else if(!RM)homeUI();
});
</script>
